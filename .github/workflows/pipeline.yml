name: CI-CD (vind)

on:
  push:
    branches: [ "dev", "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build_deploy_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image variables
        run: |
          echo "BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "IMAGE_REPO=ghcr.io/${{ github.repository_owner }}/vind" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      # Install vcluster CLI (vind uses vcluster + docker driver)
      - name: Setup vcluster
        uses: loft-sh/setup-vcluster@v0.0.1

      - name: Create vind cluster (vcluster docker driver)
        run: |
          vcluster version
          vcluster use driver docker
          vcluster create vind-ci --connect=false --wait
          kubectl get nodes -o wide

      - name: Deploy with Helm
        run: |
          helm dependency update charts/vind
          helm upgrade --install vind charts/vind \
            --namespace default \
            --set image.repository=${IMAGE_REPO} \
            --set image.tag=${IMAGE_TAG} \
            --set service.type=LoadBalancer \
            --set service.port=8080

      - name: Discover endpoint and validate (no port-forward)
        run: |
          # Wait for LB to get an external address
          for i in $(seq 1 60); do
            host="$(kubectl get svc vind -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            if [ -z "$host" ]; then
              host="$(kubectl get svc vind -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            fi
            if [ -n "$host" ]; then
              echo "LB host: $host"
              echo "URL=http://${host}:8080/" >> $GITHUB_ENV
              break
            fi
            echo "Waiting for LoadBalancer external address ($i/60)..."
            sleep 5
          done

          if [ -z "${URL:-}" ]; then
            echo "Failed to obtain LoadBalancer address"
            kubectl get svc -o wide
            exit 1
          fi

          ./scripts/validate.sh "$URL"
